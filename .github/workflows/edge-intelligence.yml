name: Flare Edge Intelligence

on:
  push:
    branches: [main]
    paths:
      - 'edge_intelligence.py'
      - 'sitecustomize.py'
      - 'tests/test_edge_intelligence.py'
      - '.github/workflows/edge-intelligence.yml'
  workflow_dispatch:

jobs:
  edge-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
      - name: Compile bridge
        run: python -m py_compile edge_intelligence.py sitecustomize.py
      - name: Run Edge intelligence regressions
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_edge_intelligence.py
