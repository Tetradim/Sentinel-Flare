name: Flare Edge Intelligence

on:
  push:
    branches: [main]
    paths:
      - 'edge_intelligence.py'
      - 'sitecustomize.py'
      - 'tests/test_edge_intelligence.py'
      - '.github/workflows/edge-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  edge-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mark bridge checks pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "{\"state\":\"pending\",\"context\":\"Flare Edge Intelligence\",\"description\":\"Flare intelligence bridge checks are running\",\"target_url\":\"${target_url}\"}"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
      - name: Compile bridge
        run: python -m py_compile edge_intelligence.py sitecustomize.py
      - name: Run Edge intelligence regressions
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_edge_intelligence.py
      - name: Publish successful bridge status
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "{\"state\":\"success\",\"context\":\"Flare Edge Intelligence\",\"description\":\"Flare intelligence bridge checks passed\",\"target_url\":\"${target_url}\"}"
      - name: Publish failed bridge status
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "{\"state\":\"failure\",\"context\":\"Flare Edge Intelligence\",\"description\":\"Flare intelligence bridge checks failed\",\"target_url\":\"${target_url}\"}"
